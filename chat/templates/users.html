
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusChat | People</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f8;
            color: #263238;
        }

        .navbar {
            background: #2b8a7a;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
        }

        .logout {
            background: white;
            color: #2b8a7a;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin-bottom: 8px;
            color: #204f48;
        }

        .welcome p {
            color: #667777;
        }

        .people-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }

        .people-card h3 {
            margin-top: 0;
            margin-bottom: 22px;
        }

        .user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 17px 0;
            border-bottom: 1px solid #edf0f0;
        }

        .user-row:last-child {
            border-bottom: none;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 0;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #e0f2ee;
            color: #2b8a7a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            flex-shrink: 0;
        }

        .username {
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .status {
            color: #71817e;
            font-size: 13px;
            margin-top: 5px;
        }

        .chat-button {
            background: #2b8a7a;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            white-space: nowrap;
        }

        .chat-button:hover {
            background: #226f63;
        }

        .empty {
            color: #71817e;
            text-align: center;
            padding: 25px 0;
        }

        @media (max-width: 500px) {
            .navbar {
                padding: 16px 20px;
            }

            .brand {
                font-size: 22px;
            }

            .container {
                margin-top: 25px;
                padding: 0 14px;
            }

            .people-card {
                padding: 18px;
            }

            .user-row {
                gap: 10px;
            }

            .chat-button {
                padding: 9px 13px;
            }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="brand">💬 CampusChat</div>

        <form action="/logout/" method="post">
            {% csrf_token %}
            <button class="logout" type="submit">Logout</button>
        </form>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>Welcome, {{ request.user.username }}! 👋</h2>
            <p>Connect with your campus community.</p>
        </section>

        <section class="people-card">
            <h3>People</h3>

            {% for user in users %}
                <div class="user-row">

                    <div class="user-info">
                        <div class="avatar">👤</div>

                        <div>
                            <div class="username">
                                {{ user.username }}
                            </div>
                            <div class="status">
                                CampusChat member
                            </div>
                        </div>
                    </div>

                    <a class="chat-button"
                       href="{% url 'private_chat' user.id %}">
                        Chat
                    </a>

                </div>
            {% empty %}
                <p class="empty">
                    No other users available yet.
                </p>
            {% endfor %}

        </section>

    </main>

</body>
</html>
