

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusMeet</title>



    <style>

        * {

            box-sizing: border-box;

        }



        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f7f8;

            color: #263238;

            text-align: center;

        }



        .navbar {

            background: #2b8a7a;

            color: white;

            padding: 18px;

            font-size: 24px;

            font-weight: bold;

        }



        .container {

            max-width: 1000px;

            margin: 35px auto;

            padding: 20px;

        }



        .videos {

            display: flex;

            flex-wrap: wrap;

            justify-content: center;

            gap: 20px;

            margin-top: 25px;

        }



        .video-card {

            flex: 1 1 320px;

            min-width: 0;

            max-width: 460px;

            padding: 12px;

            background: white;

            border-radius: 15px;

            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);

        }



        .video-card video {

            width: 100%;

            min-height: 220px;

            background: #182321;

            border-radius: 10px;

            object-fit: cover;

        }



        .video-card h3 {

            margin: 8px 0 12px;

        }



        #status {

            color: #2b8a7a;

            font-weight: bold;

        }

    </style>

</head>



<body>



    <div class="navbar">🎥 CampusMeet</div>



    <main class="container">

        <h2>Meeting Room</h2>



        <p>

            Room: <strong>{{ room_name }}</strong>

        </p>



        <p id="status">Starting camera...</p>



<div style="margin: 20px;">

    <button id="cameraBtn" onclick="toggleCamera()">

        📷 Turn Camera Off

    </button>



    <button id="micBtn" onclick="toggleMic()">

        🎤 Mute Microphone

    </button>



<button id="screenBtn" onclick="toggleScreenShare()">

    🖥️ Share Screen

</button>



<div style="margin: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 10px;">

    <h3>📁 Share Files</h3>



    <input type="file" id="fileInput">



    <button id="sendFileBtn" onclick="sendFile()">

        📤 Send File

    </button>



    <div id="fileStatus" style="margin-top: 10px;"></div>



    <h4>Shared Files</h4>

    <div id="sharedFiles"></div>



<div style="margin: 25px auto; padding: 20px; max-width: 900px; background: white; border-radius: 12px; border: 1px solid #ddd;">



    <h3>🎨 CampusMeet Collaborative Whiteboard</h3>



    <div style="margin-bottom: 12px;">

        <label for="boardColor">Pen Color:</label>

        <input type="color" id="boardColor" value="#2b8a7a">



        <label for="boardSize" style="margin-left: 15px;">

            Pen Size:

        </label>

        <input type="range" id="boardSize" min="1" max="15" value="3">



        <button id="clearBoardBtn" onclick="clearWhiteboard()">

            🧹 Clear Board

        </button>

    </div>



    <canvas

        id="whiteboard"

        width="850"

        height="400"

        style="width: 100%; max-width: 850px; border: 2px solid #2b8a7a; border-radius: 8px; touch-action: none; cursor: crosshair;"

    ></canvas>



    <p id="boardStatus">Ready to draw!</p>



</div>

</div>



</div>





        <div class="videos">

            <div class="video-card">

                <h3>You</h3>

                <video id="localVideo" autoplay playsinline muted></video>

            </div>



            <div id="remoteVideos" class="videos"></div>

        </div>

    </main>



    <script>

        const myUsername = "{{ request.user.username|escapejs }}";

        const roomName = "{{ room_name|escapejs }}";



        let localStream;

        let socket;



        const peerConnections = {};

        const pendingCandidates = {};



        const configuration = {

            iceServers: [

                {

                    urls: "stun:stun.l.google.com:19302"

                }

            ]

        };



        function sendSignal(data) {

            if (socket && socket.readyState === WebSocket.OPEN) {

                socket.send(JSON.stringify(data));

            } else {

                console.warn("Signaling socket is not connected.");

            }

        }



        async function startCamera() {

            try {

                
localStream = await navigator.mediaDevices.getUserMedia({
    video: true,
    audio: {
        deviceId: {
            exact: "7bdd44ced4949cd0e97fcce4de810983851f69704d572e8ac7827789d128e9f9"
        }
    }
});

                document.getElementById("localVideo").srcObject = localStream;



                connectWebSocket();

            } catch (error) {

                console.error("Camera/microphone error:", error);

                document.getElementById("status").textContent =

                    "Camera access failed. Check browser permissions.";

            }

        }



        function connectWebSocket() {

            const protocol =

                window.location.protocol === "https:" ? "wss\://" : "ws\://";



            socket = new WebSocket(

                protocol + window.location.host +

                "/ws/meeting/" + encodeURIComponent(roomName) + "/"

            );



            socket.onopen = function () {

                console.log("Meeting WebSocket connected");

                document.getElementById("status").textContent =

                    "Connected to meeting. Waiting for participants...";



                sendSignal({ type: "join" });

            };





socket.onmessage = async function (event) {

    const data = JSON.parse(event.data);



    console.log("SIGNAL RECEIVED:", data);



    try {

        if (data.type === "join") {

            if (data.username && data.username !== myUsername) {

                console.log("New user joined:", data.username);

                await createOffer(data.username);

            }

        } else if (data.type === "offer") {

            await handleOffer(data);

        } else if (data.type === "answer") {

            await handleAnswer(data);

        } else if (data.type === "candidate") {

            await handleCandidate(data);

        } else if (data.type === "whiteboard_draw") {

            const ctx = document

                .getElementById("whiteboard")

                .getContext("2d");



            ctx.beginPath();

            ctx.moveTo(data.x1, data.y1);

            ctx.lineTo(data.x2, data.y2);

            ctx.strokeStyle = data.color;

            ctx.lineWidth = data.lineWidth;

            ctx.lineCap = "round";

            ctx.lineJoin = "round";

            ctx.stroke();

        } else if (data.type === "whiteboard_clear") {

            const canvas = document.getElementById("whiteboard");

            canvas.getContext("2d").clearRect(

                0, 0, canvas.width, canvas.height

            );

        }

    } catch (error) {

        console.error("Meeting message error:", error);

    }

};

            socket.onerror = function (error) {
                console.error("WebSocket error:", error);
            };

            socket.onclose = function () {
                console.log("Meeting WebSocket disconnected");
                const status = document.getElementById("status");
                if (status) {
                    status.textContent = "Meeting connection disconnected.";
                }
            };
        }

        function createPeerConnection(peerId) {

            if (peerConnections[peerId]) {

                return peerConnections[peerId];

            }



            const pc = new RTCPeerConnection(configuration);



            localStream.getTracks().forEach(function (track) {

                pc.addTrack(track, localStream);

            });



            pc.ontrack = function (event) {

                let card = document.getElementById("card-" + safeId(peerId));



                if (!card) {

                    card = document.createElement("div");

                    card.className = "video-card";

                    card.id = "card-" + safeId(peerId);



                    const heading = document.createElement("h3");

                    heading.textContent = peerId;



                    const video = document.createElement("video");

                    video.id = "remote-" + safeId(peerId);

                    video.autoplay = true;

                    video.playsInline = true;



                    card.appendChild(heading);

                    card.appendChild(video);

                    document.getElementById("remoteVideos").appendChild(card);

                }



                const remoteVideo =

                    document.getElementById("remote-" + safeId(peerId));



                if (remoteVideo.srcObject !== event.streams[0]) {

                    remoteVideo.srcObject = event.streams[0];

                }



                document.getElementById("status").textContent =

                    "Remote video connected!";

            };



            pc.onicecandidate = function (event) {

                if (event.candidate) {

                    sendSignal({

                        type: "candidate",

                        target: peerId,

                        candidate: event.candidate

                    });

                }

            };



            pc.onconnectionstatechange = function () {

                console.log("Peer", peerId, "connection:", pc.connectionState);

            };



            peerConnections[peerId] = pc;

            pendingCandidates[peerId] = pendingCandidates[peerId] || [];



            return pc;

        }



        function safeId(value) {

            return Array.from(value)

                .map(char => char.codePointAt(0).toString(16))

                .join("-");

        }



        async function createOffer(peerId) {

            const pc = createPeerConnection(peerId);



            const offer = await pc.createOffer();

            await pc.setLocalDescription(offer);



            sendSignal({

                type: "offer",

                target: peerId,

                offer: pc.localDescription

            });



            console.log("Offer sent to:", peerId);

        }



        async function handleOffer(data) {

            const peerId = data.username;



            if (!peerId || peerId === myUsername) return;



            const pc = createPeerConnection(peerId);



            await pc.setRemoteDescription(

                new RTCSessionDescription(data.offer)

            );



            await flushCandidates(peerId);



            const answer = await pc.createAnswer();

            await pc.setLocalDescription(answer);



            sendSignal({

                type: "answer",

                target: peerId,

                answer: pc.localDescription

            });



            console.log("Answer sent to:", peerId);

        }



        async function handleAnswer(data) {

            const peerId = data.username;

            const pc = peerConnections[peerId];



            if (!pc || !data.answer) return;



            await pc.setRemoteDescription(

                new RTCSessionDescription(data.answer)

            );



            await flushCandidates(peerId);

        }



        async function handleCandidate(data) {

            const peerId = data.username;



            if (!peerId || !data.candidate) return;



            const pc = peerConnections[peerId];



            if (pc && pc.remoteDescription) {

                await pc.addIceCandidate(

                    new RTCIceCandidate(data.candidate)

                );

            } else {

                pendingCandidates[peerId] = pendingCandidates[peerId] || [];

                pendingCandidates[peerId].push(data.candidate);

            }

        }



        async function flushCandidates(peerId) {

            const pc = peerConnections[peerId];

            const candidates = pendingCandidates[peerId] || [];



            if (!pc || !pc.remoteDescription) return;



            while (candidates.length > 0) {

                const candidate = candidates.shift();



                await pc.addIceCandidate(

                    new RTCIceCandidate(candidate)

                );

            }

        }



        window.addEventListener("beforeunload", function () {

            Object.values(peerConnections).forEach(pc => pc.close());



            if (localStream) {

                localStream.getTracks().forEach(track => track.stop());

            }



            if (socket) socket.close();

        });





function toggleCamera() {

    if (!localStream) return;



    const videoTrack = localStream.getVideoTracks()[0];

    if (!videoTrack) return;



    videoTrack.enabled = !videoTrack.enabled;



    document.getElementById("cameraBtn").textContent =

        videoTrack.enabled

            ? "📷 Turn Camera Off"

            : "📷 Turn Camera On";

}



function toggleMic() {

    if (!localStream) return;



    const audioTrack = localStream.getAudioTracks()[0];

    if (!audioTrack) return;



    audioTrack.enabled = !audioTrack.enabled;



    document.getElementById("micBtn").textContent =

        audioTrack.enabled

            ? "🎤 Mute Microphone"

            : "🔇 Unmute Microphone";

}



let screenStream = null;

let screenSharing = false;



async function toggleScreenShare() {

    if (!localStream) {

        alert("Please start your camera first.");

        return;

    }



    if (!screenSharing) {

        try {

            screenStream = await navigator.mediaDevices.getDisplayMedia({

                video: true,

                audio: false

            });



            const screenTrack = screenStream.getVideoTracks()[0];



            for (const pc of Object.values(peerConnections)) {

                const sender = pc.getSenders().find(

                    s => s.track && s.track.kind === "video"

                );



                if (sender) {

                    await sender.replaceTrack(screenTrack);

                }

            }



            screenSharing = true;

            document.getElementById("screenBtn").textContent =

                "🛑 Stop Sharing";



            screenTrack.onended = stopScreenShare;



        } catch (error) {

            console.error("Screen sharing error:", error);

        }

    } else {

        await stopScreenShare();

    }

}



async function stopScreenShare() {

    if (!screenSharing || !screenStream) return;



    const screenTrack = screenStream.getVideoTracks()[0];



    for (const pc of Object.values(peerConnections)) {

        const sender = pc.getSenders().find(

            s => s.track === screenTrack

        );



        if (sender) {

            const cameraTrack = localStream.getVideoTracks()[0];

            if (cameraTrack) {

                await sender.replaceTrack(cameraTrack);

            }

        }

    }



    screenStream.getTracks().forEach(track => track.stop());

    screenStream = null;

    screenSharing = false;



    document.getElementById("screenBtn").textContent =

        "🖥️ Share Screen";

}



async function sendFile() {

    const input = document.getElementById("fileInput");

    const status = document.getElementById("fileStatus");

    const button = document.getElementById("sendFileBtn");



    if (!input.files.length) {

        status.textContent = "Please choose a file first.";

        return;

    }



    const formData = new FormData();

    formData.append("file", input.files[0]);



    button.disabled = true;

    status.textContent = "Uploading file...";



    try {

        const response = await fetch(

            `/meeting/${encodeURIComponent(roomName)}/files/upload/`,

            {

                method: "POST",

                body: formData,

                headers: {

                    "X-CSRFToken": getCsrfToken()

                }

            }

        );



        const result = await response.json();



        if (!response.ok) {

            throw new Error(result.error || "Upload failed.");

        }



        status.textContent = "File uploaded successfully!";

        input.value = "";

        await loadSharedFiles();



    } catch (error) {

        status.textContent = error.message;

    } finally {

        button.disabled = false;

    }

}



function getCsrfToken() {

    const match = document.cookie.match(/(?:^|; )csrftoken=([^;]*)/);

    return match ? decodeURIComponent(match[1]) : "";

}



async function loadSharedFiles() {

    const container = document.getElementById("sharedFiles");



    try {

        const response = await fetch(

            `/meeting/${encodeURIComponent(roomName)}/files/`

        );



        if (!response.ok) {

            throw new Error("Could not load shared files.");

        }



        const result = await response.json();

        container.replaceChildren();



        if (result.files.length === 0) {

            container.textContent = "No files shared yet.";

            return;

        }



        result.files.forEach(file => {

            const item = document.createElement("div");

            const name = document.createElement("span");

            const link = document.createElement("a");



            name.textContent = `${file.name} — shared by ${file.sender} `;

            link.textContent = "Download";

            link.href = file.url;



            item.append(name, link);

            container.appendChild(item);

        });

    } catch (error) {

        container.textContent = error.message;

    }

}



loadSharedFiles();

setInterval(loadSharedFiles, 5000);



const whiteboard = document.getElementById("whiteboard");

const boardContext = whiteboard.getContext("2d");



let isDrawing = false;

let lastX = 0;

let lastY = 0;



function getBoardPosition(event) {

    const rect = whiteboard.getBoundingClientRect();



    return {

        x: (event.clientX - rect.left) *

            (whiteboard.width / rect.width),

        y: (event.clientY - rect.top) *

            (whiteboard.height / rect.height)

    };

}



whiteboard.addEventListener("pointerdown", function(event) {

    isDrawing = true;



    const position = getBoardPosition(event);

    lastX = position.x;

    lastY = position.y;



    whiteboard.setPointerCapture(event.pointerId);

});



whiteboard.addEventListener("pointermove", function(event) {

    if (!isDrawing) return;



    const position = getBoardPosition(event);



    boardContext.beginPath();

    boardContext.moveTo(lastX, lastY);

    boardContext.lineTo(position.x, position.y);



    boardContext.strokeStyle =

        document.getElementById("boardColor").value;



    boardContext.lineWidth =

        Number(document.getElementById("boardSize").value);



    boardContext.lineCap = "round";

    boardContext.lineJoin = "round";

    boardContext.stroke();



if (socket && socket.readyState === WebSocket.OPEN) {

    socket.send(JSON.stringify({

        type: "whiteboard_draw",

        x1: lastX,

        y1: lastY,

        x2: position.x,

        y2: position.y,

        color: document.getElementById("boardColor").value,

        lineWidth: Number(

            document.getElementById("boardSize").value

        )

    }));

}





    lastX = position.x;

    lastY = position.y;

});



function stopDrawing() {

    isDrawing = false;

}



whiteboard.addEventListener("pointerup", stopDrawing);

whiteboard.addEventListener("pointercancel", stopDrawing);

whiteboard.addEventListener("lostpointercapture", stopDrawing);



function clearWhiteboard() {
    boardContext.clearRect(0, 0, whiteboard.width, whiteboard.height);

    document.getElementById("boardStatus").textContent = "Whiteboard cleared.";

    if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: "whiteboard_clear" }));
    }
}











        startCamera();

    </script>



</body>

</html>
